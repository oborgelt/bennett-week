<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

        <a class="trophy-chip" href="index.html?room=1" aria-label="Trophy Room"><span class="trophy-chip-full">Trophy Room</span><span class="trophy-chip-short">Trophies</span></a>
        <a class="progress-chip" href="progress.html" aria-label="Progress"><span class="progress-chip-full">Progress</span><span class="progress-chip-short">Dash</span></a>
        <a class="crew-chip" href="characters.html" aria-label="Characters"><span class="crew-chip-full">Characters</span><span class="crew-chip-short">Crew</span></a>
        <a class="basecamp-chip" href="basecamp.html" aria-label="Base Camp"><span class="basecamp-chip-full">Base Camp</span><span class="basecamp-chip-short">Camp</span></a>
        <a class="story-chip" id="story-chip" href="story.html" hidden>Story</a>
        <a class="messages-chip on" href="messages.html" aria-current="page" aria-label="Messages"><span class="messages-chip-full">Messages</span><span class="messages-chip-short">Msgs</span><span class="messages-badge" hidden></span></a>
        <a class="parent-chip" href="parent.html" aria-label="Parent desk"><span class="parent-chip-full">Parent desk</span><span class="parent-chip-short">Desk</span></a>

    </div>
    <div class="banner-wrap">

      <img src="img/monkey-band-banner.png" alt="Monkey garage band on a tennis court">
      <a class="banner-title" href="index.html">
        <h1>Messages</h1>
        <p>Asks, check-ins, replies</p>
      </a>
      <div class="build-stamp" id="build-stamp">
        <span>Build 68</span>
        <span>8/17, 4:50 PM</span>
      </div>
    </div>

  <main class="messages-wrap parent-wrap">
    <p class="messages-lead">Newest first. Every ask, check-in, and reply. Delete a test thread with Delete.</p>
    <p class="messages-sync" id="messages-sync" hidden></p>
    <div id="messages-inbox"></div>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/build.js?v=133"></script>
