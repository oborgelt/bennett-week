<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071618">
  <title>Locker refs · Jungle Jam</title>
  <link rel="stylesheet" href="css/theme.css?v=147">
</head>
<body class="parent-page refs-page">
  <header class="week-head">
    <div class="hud-bar progress-hud">
      <div class="bananas" id="bananas" aria-live="polite">🍌 0</div>
    <div class="hud-nav">
        <a class="week-chip" href="index.html"><span class="week-chip-full">This week</span><span class="week-chip-short">Week</span></a>
        <a class="trophy-chip" href="index.html?room=1" aria-label="Trophy Room"><span class="trophy-chip-full">Trophy Room</span><span class="trophy-chip-short">Trophies</span></a>
        <a class="progress-chip" href="progress.html" aria-label="Progress"><span class="progress-chip-full">Progress</span><span class="progress-chip-short">Dash</span></a>
        <a class="crew-chip" href="characters.html" aria-label="Characters"><span class="crew-chip-full">Characters</span><span class="crew-chip-short">Crew</span></a>
        <a class="basecamp-chip" href="basecamp.html" aria-label="Base Camp"><span class="basecamp-chip-full">Base Camp</span><span class="basecamp-chip-short">Camp</span></a>
        <a class="story-chip" id="story-chip" href="story.html" hidden>Story</a>
        <a class="messages-chip" href="messages.html" aria-label="Messages"><span class="messages-chip-full">Messages</span><span class="messages-chip-short">Msgs</span><span class="messages-badge" hidden></span></a>
        <a class="parent-chip" href="parent.html" aria-label="Parent desk"><span class="parent-chip-full">Parent desk</span><span class="parent-chip-short">Desk</span></a>
        <a class="admin-chip" href="admin.html">Admin</a>
        <a class="egg-chip" id="egg-chip" href="egg.html" hidden>🥚 Play</a>
      </div>
    </div>
    <div class="banner-wrap">
      <a class="banner-home" href="index.html" aria-label="Jungle Jam home · This week"></a>
      <img src="img/monkey-band-banner.png" alt="Monkey garage band on a tennis court">
      <a class="banner-title" href="index.html">
        <h1>Locker refs</h1>
        <p>Ace · Riff · Scorch · Deuce · Fuzz · Bennett</p>
      </a>
      <div class="build-stamp" id="build-stamp">
        <span>Build 43</span>
        <span>8/15, 3:40 PM</span>
      </div>
    </div>
  </header>

  <main class="refs-wrap">
    <p class="refs-note">Drag these into Imagine (Quality / Image). Do not redesign.</p>
    <ol class="refs-grid">
      <li class="refs-card">
        <figure>
          <img src="img/characters/ace.jpg" alt="1 Ace" width="928" height="1376" draggable="true">
          <figcaption>1 Ace</figcaption>
        </figure>
      </li>
      <li class="refs-card">
        <figure>
          <img src="img/characters/riff.jpg" alt="2 Riff" width="1408" height="1408" draggable="true">
          <figcaption>2 Riff</figcaption>
        </figure>
      </li>
      <li class="refs-card">
        <figure>
          <img src="img/characters/scorch.jpg" alt="3 Scorch" width="1408" height="1408" draggable="true">
          <figcaption>3 Scorch</figcaption>
        </figure>
      </li>
      <li class="refs-card">
        <figure>
          <img src="img/characters/deuce.jpg" alt="4 Deuce" width="1408" height="1408" draggable="true">
          <figcaption>4 Deuce</figcaption>
        </figure>
      </li>
      <li class="refs-card">
        <figure>
          <img src="img/characters/fuzz.jpg" alt="5 Fuzz" width="1408" height="1408" draggable="true">
          <figcaption>5 Fuzz</figcaption>
        </figure>
      </li>
      <li class="refs-card">
        <figure>
          <img src="img/characters/bennett.jpg" alt="6 Bennett" width="928" height="1376" draggable="true">
          <figcaption>6 Bennett</figcaption>
        </figure>
      </li>
    </ol>
  </main>

  <script src="js/build.js?v=147"></script>
  <script src="js/game.js?v=147"></script>
  <script src="js/telemetry.js?v=147"></script>
  <script>
    (function () {
      var el = document.getElementById("bananas");
      if (el && window.Game) el.textContent = "🍌 " + Game.getBananas();
    })();
  </script>
</body>
</html>
