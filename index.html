<body class="week-page">

      <img src="img/monkey-band-banner.png" alt="Monkey garage band on a tennis court">
      <button type="button" class="banner-hotspot" id="banner-monkey" aria-label="Tap the monkey band"></button>
      <a class="banner-title" href="index.html" aria-label="Jungle Jam home · This week">
        <h1>Jungle Jam</h1>
        <p>Olathe East · sophomore lobby</p>
      </a>
      <div class="build-stamp" id="build-stamp">
        <span>Build 45</span>
        <span>8/15, 6:10 PM</span>
      </div>
    </div>
    <div class="hud-bar">
      <div class="bananas" id="bananas" aria-live="polite">🍌 0</div>
      <div class="rally">
        <div class="rally-label">Week rally</div>
        <div class="rally-row">
          <div class="rally-bar"><div class="rally-fill" id="rally-fill"></div></div>
          <div class="rally-count" id="rally-count">0/0</div>
        </div>
      </div>
      <button type="button" class="trophies" id="trophies">🏆 <span id="trophy-count">0</span></button>
      <div class="hud-nav">
        <a class="week-chip on" href="index.html" aria-current="page"><span class="week-chip-full">This week</span><span class="week-chip-short">Week</span></a>
        <a class="progress-chip" href="progress.html" aria-label="Progress"><span class="progress-chip-full">Progress</span><span class="progress-chip-short">Dash</span></a>
        <a class="crew-chip" href="characters.html" aria-label="Characters"><span class="crew-chip-full">Characters</span><span class="crew-chip-short">Crew</span></a>
        <a class="story-chip" id="story-chip" href="story.html" hidden>Story</a>
        <a class="parent-chip" href="parent.html" aria-label="Parent desk"><span class="parent-chip-full">Parent desk</span><span class="parent-chip-short">Desk</span></a>
        <a class="admin-chip" href="admin.html">Admin</a>
        <a class="egg-chip" id="egg-chip" href="egg.html" hidden>🥚 Play</a>
      </div>
    </div>
    <p class="draft-flag" id="draft-flag" hidden>Using parent desk draft on this device</p>
    <section class="standing-classes" id="standing-classes" aria-label="Classes">
      <h2>Classes</h2>
      <div class="standing-class-list" id="standing-class-list"></div>
    </section>
  </header>

  <div class="dots" id="dots"></div>
  <div class="track" id="track"></div>
  <nav class="week-nav">
    <button id="prev" type="button">← Prev</button>
    <button id="next" type="button">Next →</button>
  </nav>

  <div class="peek-monkey" aria-hidden="true">
    <img src="img/monkey-tennis.png" alt="">
  </div>
  <button type="button" class="hidden-ball" id="hidden-ball" aria-label="Hidden tennis ball"></button>

  <div class="shelf" id="shelf">
    <div class="trophy-room" id="trophy-room" role="dialog" aria-modal="true" aria-label="Treehouse" data-view="wide">
      <div class="trophy-stage" id="trophy-stage">
        <div class="trophy-view trophy-wide" id="trophy-wide">
          <div class="trophy-look" id="trophy-look-wide">
            <img class="trophy-still" src="img/library/trophy-room.jpg" alt="Inside the jungle treehouse">
            <div class="trophy-hotspots" id="trophy-hotspots"></div>
          </div>
        </div>
        <div class="trophy-view trophy-close" id="trophy-close" aria-hidden="true">
          <div class="trophy-look" id="trophy-look-close">
            <img class="trophy-still" id="trophy-close-still" alt="">
            <div class="trophy-slots" id="trophy-slots"></div>
          </div>
          <div class="trophy-portrait-rail" id="trophy-portrait-rail" hidden aria-label="Crew portraits"></div>
        </div>
      </div>
      <p class="trophy-lantern-hint" id="trophy-lantern-hint" hidden>Tap a lantern</p>
      <nav class="trophy-walkup" id="trophy-walkup" aria-label="Walk up to a spot">
        <button type="button" class="trophy-lantern" data-zone="window">Window</button>
        <button type="button" class="trophy-lantern" data-zone="pedestal">Pedestal</button>
        <button type="button" class="trophy-lantern" data-zone="cubbies">Cubbies</button>
        <button type="button" class="trophy-lantern" data-zone="pegboard">Pegs</button>
        <button type="button" class="trophy-lantern" data-zone="lockers">Lockers</button>
      </nav>
      <nav class="trophy-back-row" id="trophy-back-row" hidden aria-label="Back to the treehouse">
        <button type="button" class="trophy-lantern trophy-back" id="trophy-back">Back to treehouse</button>
      </nav>
      <button type="button" class="trophy-leave" id="trophy-leave" aria-label="Leave the treehouse">✕</button>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-panel" role="dialog" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <div>
          <h2 id="sheet-title">Sheet</h2>
        </div>
        <button type="button" class="close-sheet" id="close-sheet" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
