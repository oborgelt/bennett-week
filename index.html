<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#071618">
  <title>Bennett · This week</title>
  <link rel="stylesheet" href="css/theme.css">

<body class="week-page">
  <div class="note-field" id="notes" aria-hidden="true"></div>
  <button type="button" class="clarinet" id="clarinet" aria-label="Honk the clarinet">🎶</button>

  <header class="week-head">
    <div class="banner-wrap">
      <img src="img/monkey-band-banner.png" alt="Monkey garage band on a tennis court">
      <button type="button" class="banner-hotspot" id="banner-monkey" aria-label="Tap the monkey band"></button>
      <div class="banner-title">
        <h1>Bennett Week</h1>
        <p>Olathe East · sophomore lobby</p>
      </div>
      <div class="build-stamp" id="build-stamp">
        <span>Build 25</span>
        <span>8/15, 10:20 AM</span>
      </div>
    </div>
    <div class="hud-bar">
      <div class="bananas" id="bananas" aria-live="polite">🍌 0</div>
      <div class="rally">
        <div class="rally-label">Week rally</div>
        <div class="rally-row">
          <div class="rally-bar"><div class="rally-fill" id="rally-fill"></div></div>
          <div class="rally-count" id="rally-count">0/0</div>
        </div>
      </div>
      <button type="button" class="trophies" id="trophies">🏆 <span id="trophy-count">0</span></button>
      <div class="hud-nav">
        <a class="week-chip on" href="index.html" aria-current="page"><span class="week-chip-full">This week</span><span class="week-chip-short">Week</span></a>
        <a class="progress-chip" href="progress.html" aria-label="Progress"><span class="progress-chip-full">Progress</span><span class="progress-chip-short">Dash</span></a>
        <a class="crew-chip" href="characters.html" aria-label="Characters"><span class="crew-chip-full">Characters</span><span class="crew-chip-short">Crew</span></a>
        <a class="parent-chip" href="parent.html" aria-label="Parent desk"><span class="parent-chip-full">Parent desk</span><span class="parent-chip-short">Desk</span></a>
        <a class="egg-chip" id="egg-chip" href="egg.html" hidden>🥚 Play</a>
      </div>
    </div>
    <p class="draft-flag" id="draft-flag" hidden>Using parent desk draft on this device</p>
  </header>

  <div class="dots" id="dots"></div>
  <div class="track" id="track"></div>
  <nav class="week-nav">
    <button id="prev" type="button">← Prev</button>
    <button id="next" type="button">Next →</button>
  </nav>

  <div class="peek-monkey" aria-hidden="true">
    <img src="img/monkey-tennis.png" alt="">
  </div>
  <button type="button" class="hidden-ball" id="hidden-ball" aria-label="Hidden tennis ball"></button>

  <div class="shelf" id="shelf">
    <div class="shelf-panel" role="dialog" aria-labelledby="shelf-title">
      <div class="shelf-head">
        <div>
          <h2 id="shelf-title">Trophy room</h2>
          <p>Only trophies you have earned. Drag or tap to rearrange. <a class="crew-inline" href="characters.html">Meet your teammates →</a></p>
        </div>
        <button type="button" class="close-shelf" id="close-shelf" aria-label="Close">✕</button>
      </div>
      <div class="trophy-grid" id="trophy-grid"></div>
    </div>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-panel" role="dialog" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <div>
          <h2 id="sheet-title">Sheet</h2>
        </div>
        <button type="button" class="close-sheet" id="close-sheet" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
