<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#071618">
  <title>Bennett · Progress</title>
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="progress-page">
  <header class="week-head">
    <div class="banner-wrap">
      <img src="img/monkey-band-banner.png" alt="Monkey garage band on a tennis court">
      <div class="banner-title">
        <h1>Progress</h1>
        <p>Bennett’s activity · class dashboard</p>
      </div>
    </div>
    <div class="hud-bar progress-hud">
      <div class="bananas" id="bananas" aria-live="polite">🍌 0</div>
      <p class="progress-tagline">His opens, actions, and class grades — not the parent trophy catalog.</p>
      <div class="hud-nav">
        <a class="week-chip" href="index.html"><span class="week-chip-full">This week</span><span class="week-chip-short">Week</span></a>
        <a class="progress-chip on" href="progress.html" aria-current="page"><span class="progress-chip-full">Progress</span><span class="progress-chip-short">Dash</span></a>
        <a class="parent-chip" href="parent.html" aria-label="Parent desk"><span class="parent-chip-full">Parent desk</span><span class="parent-chip-short">Desk</span></a>
        <a class="egg-chip" id="egg-chip" href="egg.html" hidden>🥚 Play</a>
      </div>
    </div>
  </header>

  <main class="dash">
    <section class="stat-strip" id="stat-strip" aria-label="Site activity"></section>
    <section class="class-pane">
      <div class="class-pane-head">
        <h2>By class</h2>
        <p id="grades-note">Grades are TEST seed until a real feed exists.</p>
      </div>
      <div class="class-list" id="class-list"></div>
    </section>
  </main>

  <div class="peek-monkey" aria-hidden="true">
    <img src="img/monkey-tennis.png" alt="">
  </div>
  <div class="sheet" id="sheet">
    <div class="sheet-panel" role="dialog" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <div>
          <h2 id="sheet-title">Edit</h2>
        </div>
        <button type="button" class="close-sheet" id="close-sheet" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script id="week-seed" type="application/json">
{
  "timezone": "America/Chicago",
  "work": [
    {"id": "eng-names", "title": "English 10: Help me learn your names!", "due": "2026-08-17T23:59:00"},
    {"id": "eng-comics", "title": "English 10: Finish summer comic strips", "due": "2026-08-18T13:05:00"},

}

    {"id": "wrong-number-eggs", "title": "Wrong number of eggs", "test": true, "unlocksGame": "egg"}
  ]
}
  </script>
